<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <path id="arcTop" d="M 96,300 A 160,160 0 0 1 416,300" fill="none"/>
    <path id="arcBottom" d="M 110,336 A 146,146 0 0 0 402,336" fill="none"/>
    <linearGradient id="poleStripe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e6c4"/>
      <stop offset="0.5" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#f3e6c4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#050505"/>

  <circle cx="256" cy="266" r="222" fill="#050505" stroke="#c9a961" stroke-width="4"/>
  <circle cx="256" cy="266" r="204" fill="none" stroke="#c9a961" stroke-width="1.5"/>

  <!-- pino de barbeiro -->
  <g transform="translate(256,80)">
    <rect x="-10" y="-30" width="20" height="46" rx="10" fill="url(#poleStripe)" stroke="#c9a961" stroke-width="2"/>
    <circle cx="0" cy="-36" r="12" fill="#f3e6c4" stroke="#c9a961" stroke-width="2"/>
    <circle cx="0" cy="18" r="8" fill="#c9a961"/>
  </g>

  <text font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="7" fill="#ecdcb0">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">BARBEARIA</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="7" fill="#ecdcb0">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">FONGARO</textPath>
  </text>

  <!-- tesouras cruzadas (topo) -->
  <g transform="translate(256,196)" stroke="#c9a961" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="-16" y1="-10" x2="14" y2="10"/>
    <line x1="16" y1="-10" x2="-14" y2="10"/>
    <circle cx="-16" cy="-10" r="4" fill="#050505"/>
    <circle cx="16" cy="-10" r="4" fill="#050505"/>
  </g>

  <!-- placa central -->
  <rect x="96" y="228" width="320" height="112" rx="14" fill="#050505" stroke="#c9a961" stroke-width="4"/>
  <rect x="106" y="238" width="300" height="92" rx="8" fill="none" stroke="#c9a961" stroke-width="1.5"/>
  <polygon points="60,284 72,276 84,284 72,292" fill="#c9a961"/>
  <polygon points="428,284 440,276 452,284 440,292" fill="#c9a961"/>
  <text x="256" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic" font-size="66" fill="#f2e6c4">GILMAR</text>

  <!-- tesouras cruzadas (base) -->
  <g transform="translate(256,362)" stroke="#c9a961" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="-16" y1="-6" x2="14" y2="14"/>
    <line x1="16" y1="-6" x2="-14" y2="14"/>
    <circle cx="-16" cy="-6" r="4" fill="#050505"/>
    <circle cx="16" cy="-6" r="4" fill="#050505"/>
  </g>
</svg>
